<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1729" />
    <meta name="description" content="Manage rental properties, tenants, and payments with RentFlow." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RentFlow" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="apple-touch-icon" href="/brand-mark.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>RentFlow by Vertex</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (async () => {
        const isLocalDevelopment =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname === '::1';

        if (!isLocalDevelopment || !('serviceWorker' in navigator)) {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = '/src/main.jsx';
          document.body.appendChild(script);
          return;
        }

        const cleanupKey = 'rentflow-service-worker-cleaned';

        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));

          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(
              cacheNames
                .filter((cacheName) => cacheName.startsWith('rentflow-'))
                .map((cacheName) => caches.delete(cacheName)),
            );
          }

          if (!sessionStorage.getItem(cleanupKey)) {
            sessionStorage.setItem(cleanupKey, 'true');
            location.reload();
            return;
          }

          sessionStorage.removeItem(cleanupKey);
        } catch (error) {
          console.error('[ServiceWorker] Development cleanup failed:', error);
        }

        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/src/main.jsx';
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
